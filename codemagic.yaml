workflows:
  ios-unsigned-testing:
    name: iOS unsigned build (for Sideloadly free testing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        # Create this group in Codemagic → Teams → Group variables, and add
        # GOOGLE_SERVICE_INFO_PLIST as a "file" type variable (paste the
        # contents of ios/Runner/GoogleService-Info.plist you downloaded
        # from the Firebase console). Keeps the file out of the git repo.
        - firebase_ios
    scripts:
      - name: Place GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build unsigned iOS app (no Apple Developer account needed)
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned .ipa
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r build/ios/iphoneos/app-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - mobile/build/ios/iphoneos/app-unsigned.ipa

  ios-testflight:
    name: iOS signed build → TestFlight (needs paid Apple Developer account)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - firebase_ios
        - app_store_credentials
        # app_store_credentials group needs (set up once you have a paid
        # Apple Developer account): APP_STORE_CONNECT_ISSUER_ID,
        # APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY,
        # CERTIFICATE_PRIVATE_KEY — see Codemagic's iOS code signing docs.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.moulinspharma.moulins
    scripts:
      - name: Place GoogleService-Info.plist
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Get Flutter packages
        script: flutter pub get
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build and archive signed .ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
