events {
    worker_connections 1024;
}

http {
    client_max_body_size 20M;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8080;
    }

    upstream grafana {
        server grafana:3000;
    }

    # Plain HTTP: only serves the ACME (Let's Encrypt) challenge used to
    # issue/renew the cert, everything else redirects to HTTPS.
    server {
        listen 80;
        server_name moulinspharma.com www.moulinspharma.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name moulinspharma.com www.moulinspharma.com;

        ssl_certificate     /etc/letsencrypt/live/moulinspharma.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/moulinspharma.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Prometheus scrape endpoint stays internal to the docker network —
        # block it before the generic /api/ proxy below can forward it.
        location /api/metrics {
            return 404;
        }

        location /grafana/ {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # All API calls go to /api/* — nginx strips /api/ and forwards to backend
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # WebSocket upgrade support (chat: /api/ws)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # Everything else (pages, assets) → Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
